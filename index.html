<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mots Fléchés Romantiques 💖</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdf2f4;
            color: #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }

        h1 {
            color: #d85a7f;
            font-size: 1.5rem;
            margin: 5px 0;
            text-align: center;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #8c7b80;
            margin-bottom: 15px;
            text-align: center;
            padding: 0 10px;
        }

        /* Conteneur adapté pour mobile (grille 9x9 fluide) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(9, min(9.5vw, 38px));
            grid-template-rows: repeat(9, min(9.5vw, 38px));
            gap: 2px;
            background-color: #d85a7f;
            padding: 4px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(216, 90, 127, 0.2);
            max-width: 100%;
            overflow-x: auto;
        }

        .cell {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 2px;
            transition: background-color 0.2s;
        }

        /* Case noire : uniquement la définition en tout petit avec une flèche */
        .cell.black {
            background-color: #3b3035;
            font-size: min(2vw, 8px); /* Très petit pour tenir sur mobile */
            color: #ffffff;
            text-align: center;
            padding: 1px;
            line-height: 1.1;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            overflow: hidden;
        }

        /* Cases du mot mystère (JE TIENS A TOI) */
        .cell.mystery {
            background-color: #ffe6ed;
            font-weight: bold;
            color: #d85a7f;
        }

        /* Surlignage du mot actif */
        .cell.highlight {
            background-color: #ffffff !important;
            box-shadow: inset 0 0 0 2px #d85a7f;
        }
        .cell.mystery.highlight {
            background-color: #fff0f3 !important;
            box-shadow: inset 0 0 0 2px #d85a7f;
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: min(4vw, 1.1rem);
            font-weight: bold;
            text-transform: uppercase;
            background: transparent;
            color: #3b3035;
            cursor: pointer;
            -webkit-appearance: none; /* Supprime le style natif mobile */
        }

        .cell input:focus {
            outline: none;
        }

        /* Message de victoire discret en bas */
        #win-message {
            margin-top: 15px;
            font-size: 1rem;
            color: #2e7d32;
            font-weight: bold;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <h1>💖 Mots Doux Fléchés 💖</h1>
    <p class="subtitle">Touche une case pour l'horizontal, deux fois pour le vertical.</p>

    <!-- Grille 9x9 propre -->
    <div class="grid-container" id="crossword-grid">
        <!-- Ligne 0 -->
        <div class="cell black" data-row="0" data-col="0">Pas mon<br>sport ➡</div>
        <div class="cell" data-row="0" data-col="1"><input type="text" maxlength="1" data-answer="S"></div>
        <div class="cell" data-row="0" data-col="2"><input type="text" maxlength="1" data-answer="K"></div>
        <div class="cell mystery" data-row="0" data-col="3"><input type="text" maxlength="1" data-answer="I"></div>
        <div class="cell black" data-row="0" data-col="4"></div>
        <div class="cell black" data-row="0" data-col="5">Notre<br>1er mois ➡</div>
        <div class="cell" data-row="0" data-col="6"><input type="text" maxlength="1" data-answer="J"></div>
        <div class="cell" data-row="0" data-col="7"><input type="text" maxlength="1" data-answer="A"></div>
        <div class="cell" data-row="0" data-col="8"><input type="text" maxlength="1" data-answer="V"></div>

        <!-- Ligne 1 -->
        <div class="cell mystery" data-row="1" data-col="0"><input type="text" maxlength="1" data-answer="J"></div>
        <div class="cell black" data-row="1" data-col="1"></div>
        <div class="cell black" data-row="1" data-col="2"></div>
        <div class="cell mystery" data-row="1" data-col="3"><input type="text" maxlength="1" data-answer="E"></div>
        <div class="cell black" data-row="1" data-col="4"></div>
        <div class="cell mystery" data-row="1" data-col="5"><input type="text" maxlength="1" data-answer="N"></div>
        <div class="cell black" data-row="1" data-col="6"></div>
        <div class="cell black" data-row="1" data-col="7"></div>
        <div class="cell black" data-row="1" data-col="8"></div>

        <!-- Ligne 2 -->
        <div class="cell mystery" data-row="2" data-col="0"><input type="text" maxlength="1" data-answer="T"></div>
        <div class="cell black" data-row="2" data-col="1">Autre<br>pays ➡</div>
        <div class="cell" data-row="2" data-col="2"><input type="text" maxlength="1" data-answer="T"></div>
        <div class="cell mystery" data-row="2" data-col="3"><input type="text" maxlength="1" data-answer="A"></div>
        <div class="cell" data-row="2" data-col="4"><input type="text" maxlength="1" data-answer="L"></div>
        <div class="cell mystery" data-row="2" data-col="5"><input type="text" maxlength="1" data-answer="I"></div>
        <div class="cell" data-row="2" data-col="6"><input type="text" maxlength="1" data-answer="E"></div>
        <div class="cell black" data-row="2" data-col="7"></div>
        <div class="cell black" data-row="2" data-col="8"></div>

        <!-- Ligne 3 -->
        <div class="cell mystery" data-row="3" data-col="0"><input type="text" maxlength="1" data-answer="I"></div>
        <div class="cell black" data-row="3" data-col="1"></div>
        <div class="cell black" data-row="3" data-col="2"></div>
        <div class="cell mystery" data-row="3" data-col="3"><input type="text" maxlength="1" data-answer="N"></div>
        <div class="cell black" data-row="3" data-col="4"></div>
        <div class="cell mystery" data-row="3" data-col="5"><input type="text" maxlength="1" data-answer="I"></div>
        <div class="cell black" data-row="3" data-col="6"></div>
        <div class="cell black" data-row="3" data-col="7"></div>
        <div class="cell black" data-row="3" data-col="8"></div>

        <!-- Ligne 4 -->
        <div class="cell mystery" data-row="4" data-col="0"><input type="text" maxlength="1" data-answer="E"></div>
        <div class="cell black" data-row="4" data-col="1">Nombre<br>enfants ➡</div>
        <div class="cell mystery" data-row="4" data-col="2"><input type="text" maxlength="1" data-answer="E"></div>
        <div class="cell mystery" data-row="4" data-col="3"><input type="text" maxlength="1" data-answer="S"></div>
        <div class="cell black" data-row="4" data-col="4"></div>
        <div class="cell mystery" data-row="4" data-col="5"><input type="text" maxlength="1" data-answer="E"></div>
        <div class="cell black" data-row="4" data-col="6"></div>
        <div class="cell black" data-row="4" data-col="7"></div>
        <div class="cell black" data-row="4" data-col="8"></div>

        <!-- Ligne 5 -->
        <div class="cell black" data-row="5" data-col="0"></div>
        <div class="cell black" data-row="5" data-col="1"></div>
        <div class="cell black" data-row="5" data-col="2"></div>
        <div class="cell mystery" data-row="5" data-col="3"><input type="text" maxlength="1" data-answer="A"></div>
        <div class="cell black" data-row="5" data-col="4"></div>
        <div class="cell mystery" data-row="5" data-col="5"><input type="text" maxlength="1" data-answer="R"></div>
        <div class="cell black" data-row="5" data-col="6"></div>
        <div class="cell black" data-row="5" data-col="7"></div>
        <div class="cell black" data-row="5" data-col="8"></div>

        <!-- Ligne 6 -->
        <div class="cell black" data-row="6" data-col="0">Pierre<br>bague ➡</div>
        <div class="cell" data-row="6" data-col="1"><input type="text" maxlength="1" data-answer="O"></div>
        <div class="cell" data-row="6" data-col="2"><input type="text" maxlength="1" data-answer="P"></div>
        <div class="cell mystery" data-row="6" data-col="3"><input type="text" maxlength="1" data-answer="A"></div>
        <div class="cell" data-row="6" data-col="4"><input type="text" maxlength="1" data-answer="Z"></div>
        <div class="cell mystery" data-row="6" data-col="5"><input type="text" maxlength="1" data-answer="E"></div>
        <div class="cell black" data-row="6" data-col="6"></div>
        <div class="cell black" data-row="6" data-col="7"></div>
        <div class="cell black" data-row="6" data-col="8"></div>

        <!-- Ligne 7 -->
        <div class="cell black" data-row="7" data-col="0"></div>
        <div class="cell black" data-row="7" data-col="1"></div>
        <div class="cell black" data-row="7" data-col="2"></div>
        <div class="cell mystery" data-row="7" data-col="3"><input type="text" maxlength="1" data-answer="T"></div>
        <div class="cell black" data-row="7" data-col="4"></div>
        <div class="cell black" data-row="7" data-col="5"></div>
        <div class="cell black" data-row="7" data-col="6"></div>
        <div class="cell black" data-row="7" data-col="7"></div>
        <div class="cell black" data-row="7" data-col="8"></div>

        <!-- Ligne 8 -->
        <div class="cell black" data-row="8" data-col="0"></div>
        <div class="cell black" data-row="8" data-col="1"></div>
        <div class="cell black" data-row="8" data-col="2"></div>
        <div class="cell mystery" data-row="8" data-col="3"><input type="text" maxlength="1" data-answer="O"></div>
        <div class="cell black" data-row="8" data-col="4"></div>
        <div class="cell black" data-row="8" data-col="5"></div>
        <div class="cell black" data-row="8" data-col="6"></div>
        <div class="cell black" data-row="8" data-col="7"></div>
        <div class="cell black" data-row="8" data-col="8"></div>
    </div>

    <div id="win-message">✨ Bravo mon amour, tu as découvert le message secret ! ✨</div>

    <script>
        const inputs = document.querySelectorAll('.grid-container .cell input');
        let currentDirection = 'H'; 
        let activeCell = null;

        inputs.forEach(input => {
            const cell = input.parentElement;
            const row = parseInt(cell.dataset.row);
            const col = parseInt(cell.dataset.col);

            input.addEventListener('click', (e) => {
                if (activeCell === cell) {
                    currentDirection = currentDirection === 'H' ? 'V' : 'H';
                } else {
                    activeCell = cell;
                    currentDirection = 'H';
                }
                updateHighlight();
            });

            input.addEventListener('input', (e) => {
                const val = input.value.toUpperCase();
                input.value = val;
                if (val.length === 1) {
                    moveToNext(row, col, 1);
                }
                checkVictory();
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '') {
                    moveToNext(row, col, -1);
                }
            });
        });

        function moveToNext(row, col, step) {
            let nextRow = row;
            let nextCol = col;

            if (currentDirection === 'H') {
                nextCol += step;
            } else {
                nextRow += step;
            }

            const nextCell = document.querySelector(`.cell[data-row="${nextRow}"][data-col="${nextCol}"]`);
            if (nextCell) {
                const nextInput = nextCell.querySelector('input');
                if (nextInput) {
                    nextInput.focus();
                    activeCell = nextCell;
                    updateHighlight();
                }
            }
        }

        function updateHighlight() {
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('highlight'));
            if (!activeCell) return;

            const row = parseInt(activeCell.dataset.row);
            const col = parseInt(activeCell.dataset.col);

            if (currentDirection === 'H') {
                let c = col;
                while (c >= 0 && getCell(row, c) && !getCell(row, c).classList.contains('black')) {
                    getCell(row, c).classList.add('highlight');
                    c--;
                }
                c = col + 1;
                while (c < 9 && getCell(row, c) && !getCell(row, c).classList.contains('black')) {
                    getCell(row, c).classList.add('highlight');
                    c++;
                }
            } else {
                let r = row;
                while (r >= 0 && getCell(r, col) && !getCell(r, col).classList.contains('black')) {
                    getCell(r, col).classList.add('highlight');
                    r--;
                }
                r = row + 1;
                while (r < 9 && getCell(r, col) && !getCell(r, col).classList.contains('black')) {
                    getCell(r, col).classList.add('highlight');
                    r++;
                }
            }
        }

        function getCell(r, c) {
            return document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
        }

        // Petite vérification automatique pour afficher un message mignon si tout est rempli
        function checkVictory() {
            let allFilled = true;
            inputs.forEach(input => {
                if (input.value === '') allFilled = false;
            });
            if (allFilled) {
                document.getElementById('win-message').style.display = 'block';
            }
        }
    </script>
</body>
</html>
