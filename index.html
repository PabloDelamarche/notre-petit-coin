<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Invitation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Raleway:wght@300;400&display=swap');

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fcfaf8; /* Blanc cassé très doux */
            font-family: 'Raleway', sans-serif;
            overflow: hidden;
        }

        .card {
            text-align: center;
            padding: 60px;
            background: #ffffff;
            border: 1px solid #e8e4e1;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #332d2d;
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            min-height: 60px;
        }

        button {
            padding: 12px 30px;
            font-family: 'Raleway', sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border: 1px solid #332d2d;
            background: transparent;
            transition: all 0.4s ease;
        }

        #btn-oui {
            background: #332d2d;
            color: #ffffff;
        }

        #btn-oui:hover {
            background: #504848;
        }

        #btn-non {
            background: transparent;
            color: #332d2d;
        }

        #btn-non:hover {
            background: #fcfaf8;
        }

        #message-final {
            display: none;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #8b7355;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <div id="content">
            <h1>Veux-tu partager ce moment avec moi le 28 ?</h1>
            <div class="buttons-container" id="btn-wrapper">
                <button id="btn-oui" onclick="showLove()">Oui</button>
                <button id="btn-non" onmouseover="moveNon()">Non</button>
            </div>
            <p id="message-triste" style="margin-top: 20px; color: #8b7355; opacity: 0; transition: 0.5s;"></p>
        </div>

        <div id="message-final">
            Le 28 est déjà réservé dans mon cœur. ✨
        </div>
    </div>

    <script>
        let counter = 0;

        function moveNon() {
            counter++;
            const btnNon = document.getElementById('btn-non');
            const msgTriste = document.getElementById('message-triste');

            if (counter === 3) {
                msgTriste.innerText = "Beh tu ne m'aimes plus ? 🥺";
                msgTriste.style.opacity = "1";
            }

            // Déplacement aléatoire dans la fenêtre
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 100);
            
            btnNon.style.position = "fixed";
            btnNon.style.left = x + "px";
            btnNon.style.top = y + "px";
        }

        function showLove() {
            document.getElementById('content').style.display = 'none';
            document.getElementById('message-final').style.display = 'block';
        }
    </script>
</body>
</html>
