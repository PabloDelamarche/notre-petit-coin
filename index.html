    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fff0f3; text-align: center; padding: 15px; color: #444; margin: 0; }
        .card { background: white; max-width: 450px; margin: 10px auto; padding: 20px; border-radius: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        
        /* Minuteur */
        .timer-zone { background: #ff4d6d; color: white; padding: 15px; border-radius: 20px; margin-bottom: 20px; }
        #countdown { font-size: 2rem; font-weight: bold; }

        /* Quiz */
        .quiz-zone { background: #fff5f6; border: 1px solid #ffccd5; padding: 15px; border-radius: 20px; margin: 15px 0; }
        .quiz-option { display: block; width: 90%; padding: 10px; margin: 8px auto; border: 1px solid #ffccd5; border-radius: 12px; cursor: pointer; background: white; transition: 0.2s; }
        .quiz-option:hover { background: #ff4d6d; color: white; }
        
        /* Questions */
        .question-block { background: #fdf2f4; margin: 10px 0; padding: 15px; border-radius: 15px; border-left: 5px solid #ff4d6d; text-align: left; }
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 10px; padding: 8px; box-sizing: border-box; resize: none; margin-top: 5px; }
        input { width: 80%; padding: 10px; border-radius: 10px; border: 1px solid #ddd; margin: 10px 0; text-align: center; }
        .main-btn { background: #ff4d6d; color: white; border: none; padding: 15px; border-radius: 50px; cursor: pointer; font-weight: bold; width: 80%; margin-top: 10px; }
        .res { font-size: 0.85rem; margin-top: 10px; text-align: left; background: #fff; padding: 10px; border-radius: 10px; border: 1px solid #ffe5ec; }
    </style>
</head>
