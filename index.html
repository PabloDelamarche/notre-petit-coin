<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Une petite question...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #d63384;
            font-size: 24px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
            height: 50px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #btn-oui {
            background-color: #28a745;
            color: white;
        }

        #btn-oui:hover {
            transform: scale(1.1);
        }

        #btn-non {
            background-color: #dc3545;
            color: white;
            position: absolute;
        }

        /* Style pour l'affichage du cœur */
        .heart-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .heart {
            font-size: 80px;
            color: #ff3366;
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        .success-text {
            color: #d63384;
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <div id="question-section">
            <h1>Veux-tu un date le 28 ? </h1>
            <div class="buttons">
                <button id="btn-oui" onclick="validerOui()">Oui ❤️</button>
                <button id="btn-non" onmouseover="deplacerNon()" onclick="deplacerNon()">Non 😢</button>
            </div>
        </div>

        <div class="heart-container" id="heart-section">
            <div class="heart">❤️</div>
            <div class="success-text">Yesss ! Rendez-vous le 28 ! 🥰</div>
        </div>
    </div>

    <script>
        function deplacerNon() {
            const btnNon = document.getElementById('btn-non');
            
            // Récupère les dimensions de la fenêtre ou de la carte
            const maxX = window.innerWidth - btnNon.offsetWidth - 50;
            const maxY = window.innerHeight - btnNon.offsetHeight - 50;

            // Génère des coordonnées aléatoires
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;

            // Applique les nouvelles coordonnées en position fixe pour qu'il puisse s'envoler partout
            btnNon.style.position = 'fixed';
            btnNon.style.left = randomX + 'px';
            btnNon.style.top = randomY + 'px';
        }

        function validerOui() {
            // Cache la question et affiche le cœur
            document.getElementById('question-section').style.display = 'none';
            document.getElementById('heart-section').style.display = 'flex';
        }
    </script>

</body>
</html>
