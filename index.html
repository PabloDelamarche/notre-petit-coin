<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mots Fléchés Romantiques 💖</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdf2f4;
            color: #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        h1 {
            color: #d85a7f;
            font-size: 1.5rem;
            margin: 5px 0;
            text-align: center;
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #8c7b80;
            margin-bottom: 20px;
            text-align: center;
        }

        .level-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* Grille 7x7 bien espacée */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(7, 42px);
            grid-template-rows: repeat(7, 42px);
            gap: 2px;
            background-color: #d85a7f;
            padding: 4px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(216, 90, 127, 0.2);
            margin-bottom: 20px;
        }

        .cell {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 2px;
            transition: background-color 0.2s;
        }

        /* Case noire : définition + flèche */
        .cell.black {
            background-color: #3b3035;
            font-size: 0.55rem;
            color: #ffffff;
            text-align: center;
            padding: 2px;
            line-height: 1.1;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }

        /* Cases du mot mystère (en rose) */
        .cell.mystery {
            background-color: #ffe6ed;
            font-weight: bold;
            color: #d85a7f;
        }

        /* Surlignage du mot actif */
        .cell.highlight {
            background-color: #ffffff !important;
            box-shadow: inset 0 0 0 2px #d85a7f;
        }
        .cell.mystery.highlight {
            background-color: #fff0f3 !important;
            box-shadow: inset 0 0 0 2px #d85a7f;
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            background: transparent;
            color: #3b3035;
            cursor: pointer;
        }

        .cell input:focus {
            outline: none;
        }

        .password-box {
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 320px;
            width: 90%;
        }

        .password-box input[type="text"] {
            padding: 8px;
            font-size: 1rem;
            text-transform: uppercase;
            border: 2px solid #ffe6ed;
            border-radius: 4px;
            width: 80%;
            text-align: center;
            margin-bottom: 10px;
        }

        .password-box button {
            background-color: #d85a7f;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        .error-msg {
            color: #d9534f;
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>💖 Mots Doux Fléchés 💖</h1>
    <p class="subtitle">Remplis les mots. La colonne rose t'aidera à trouver le mot mystère !</p>

    <div class="level-section">
        <p style="color: #d85a7f; font-weight: bold; margin-bottom: 10px;">Niveau 1 / 3</p>
        
        <!-- Grille 7x7 Niveau 1 Corrigée -->
        <div class="grid-container" data-level="1">
            <!-- Ligne 0 -->
            <div class="cell black" data-row="0" data-col="0">Pas mon<br>sport ➡</div>
            <div class="cell" data-row="0" data-col="1"><input type="text" maxlength="1" data-answer="S"></div>
            <div class="cell" data-row="0" data-col="2"><input type="text" maxlength="1" data-answer="K"></div>
            <div class="cell" data-row="0" data-col="3"><input type="text" maxlength="1" data-answer="I"></div>
            <div class="cell black" data-row="0" data-col="4">Chez<br>nous ➡</div>
            <div class="cell" data-row="0" data-col="5"><input type="text" maxlength="1" data-answer="G"></div>
            <div class="cell" data-row="0" data-col="6"><input type="text" maxlength="1" data-answer="U"></div>

            <!-- Ligne 1 -->
            <div class="cell black" data-row="1" data-col="0">Un plat<br>➡</div>
            <div class="cell" data-row="1" data-col="1"><input type="text" maxlength="1" data-answer="S"></div>
            <div class="cell" data-row="1" data-col="2"><input type="text" maxlength="1" data-answer="U"></div>
            <div class="cell" data-row="1" data-col="3"><input type="text" maxlength="1" data-answer="S"></div>
            <div class="cell" data-row="1" data-col="4"><input type="text" maxlength="1" data-answer="H"></div>
            <div class="cell" data-row="1" data-col="5"><input type="text" maxlength="1" data-answer="I"></div>
            <div class="cell" data-row="1" data-col="6"><input type="text" maxlength="1" data-answer="S"></div>

            <!-- Ligne 2 -->
            <div class="cell black" data-row="2" data-col="0">Autre<br>pays ➡</div>
            <div class="cell" data-row="2" data-col="1"><input type="text" maxlength="1" data-answer="I"></div>
            <div class="cell" data-row="2" data-col="2"><input type="text" maxlength="1" data-answer="T"></div>
            <div class="cell" data-row="2" data-col="3"><input type="text" maxlength="1" data-answer="A"></div>
            <div class="cell" data-row="2" data-col="4"><input type="text" maxlength="1" data-answer="L"></div>
            <div class="cell" data-row="2" data-col="5"><input type="text" maxlength="1" data-answer="I"></div>
            <div class="cell" data-row="2" data-col="6"><input type="text" maxlength="1" data-answer="E"></div>

            <!-- Ligne 3 -->
            <div class="cell black" data-row="3" data-col="0">Un sport<br>➡</div>
            <div class="cell" data-row="3" data-col="1"><input type="text" maxlength="1" data-answer="V"></div>
            <div class="cell" data-row="3" data-col="2"><input type="text" maxlength="1" data-answer="O"></div>
            <div class="cell" data-row="3" data-col="3"><input type="text" maxlength="1" data-answer="L"></div>
            <div class="cell" data-row="3" data-col="4"><input type="text" maxlength="1" data-answer="L"></div>
            <div class="cell" data-row="3" data-col="5"><input type="text" maxlength="1" data-answer="E"></div>
            <div class="cell" data-row="3" data-col="6"><input type="text" maxlength="1" data-answer="Y"></div>

            <!-- Ligne 4 -->
            <div class="cell black" data-row="4" data-col="0">Sans mod.<br>➡</div>
            <div class="cell" data-row="4" data-col="1"><input type="text" maxlength="1" data-answer="B"></div>
            <div class="cell" data-row="4" data-col="2"><input type="text" maxlength="1" data-answer="I"></div>
            <div class="cell" data-row="4" data-col="3"><input type="text" maxlength="1" data-answer="S"></div>
            <div class="cell" data-row="4" data-col="4"><input type="text" maxlength="1" data-answer="O"></div>
            <div class="cell" data-row="4" data-col="5"><input type="text" maxlength="1" data-answer="U"></div>
            <div class="cell black" data-row="4" data-col="6"></div>

            <!-- Ligne 5 -->
            <div class="cell black" data-row="5" data-col="0">Le mot<br>mystère ⬇</div>
            <!-- Colonne 1 en rose (contient les lettres de M-O-N A-M-O-U-R) -->
            <div class="cell mystery" data-row="5" data-col="1"><input type="text" maxlength="1" data-answer="M"></div>
            <div class="cell mystery" data-row="5" data-col="2"><input type="text" maxlength="1" data-answer="O"></div>
            <div class="cell mystery" data-row="5" data-col="3"><input type="text" maxlength="1" data-answer="N"></div>
            <div class="cell mystery" data-row="5" data-col="4"><input type="text" maxlength="1" data-answer="A"></div>
            <div class="cell mystery" data-row="5" data-col="5"><input type="text" maxlength="1" data-answer="M"></div>
            <div class="cell mystery" data-row="5" data-col="6"><input type="text" maxlength="1" data-answer="O"></div>

            <!-- Ligne 6 -->
            <div class="cell black" data-row="6" data-col="0"></div>
            <div class="cell mystery" data-row="6" data-col="1"><input type="text" maxlength="1" data-answer="U"></div>
            <div class="cell mystery" data-row="6" data-col="2"><input type="text" maxlength="1" data-answer="R"></div>
            <div class="cell black" data-row="6" data-col="3"></div>
            <div class="cell black" data-row="6" data-col="4"></div>
            <div class="cell black" data-row="6" data-col="5"></div>
            <div class="cell black" data-row="6" data-col="6"></div>
        </div>

        <div class="password-box">
            <p style="font-size:0.9rem; margin-top:0;">Entre le mot des cases roses pour débloquer la suite :</p>
            <input type="text" id="pwd-1" placeholder="Mot de passe">
            <br>
            <button onclick="checkPassword()">Valider 🔓</button>
            <div id="error-1" class="error-msg">Oups, ce n'est pas le bon mot secret !</div>
        </div>
    </div>

    <script>
        const container = document.querySelector('.grid-container');
        const inputs = container.querySelectorAll('.cell input');
        let currentDirection = 'H';
        let activeCell = null;

        inputs.forEach(input => {
            const cell = input.parentElement;
            const row = parseInt(cell.dataset.row);
            const col = parseInt(cell.dataset.col);

            input.addEventListener('click', () => {
                if (activeCell === cell) {
                    currentDirection = currentDirection === 'H' ? 'V' : 'H';
                } else {
                    activeCell = cell;
                    currentDirection = 'H';
                }
                updateHighlight(container, activeCell, currentDirection);
            });

            input.addEventListener('input', () => {
                const val = input.value.toUpperCase();
                input.value = val;
                if (val.length === 1) {
                    moveToNext(container, row, col, 1, currentDirection);
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '') {
                    moveToNext(container, row, col, -1, currentDirection);
                }
            });
        });

        function moveToNext(container, row, col, step, direction) {
            let nextRow = row;
            let nextCol = col;
            if (direction === 'H') nextCol += step;
            else nextRow += step;

            const nextCell = container.querySelector(`.cell[data-row="${nextRow}"][data-col="${nextCol}"]`);
            if (nextCell) {
                const nextInput = nextCell.querySelector('input');
                if (nextInput) {
                    nextInput.focus();
                    updateHighlight(container, nextCell, direction);
                }
            }
        }

        function updateHighlight(container, activeCell, direction) {
            container.querySelectorAll('.cell').forEach(c => c.classList.remove('highlight'));
            if (!activeCell) return;
            const row = parseInt(activeCell.dataset.row);
            const col = parseInt(activeCell.dataset.col);

            if (direction === 'H') {
                let c = col;
                while (c >= 0 && getCell(container, row, c) && !getCell(container, row, c).classList.contains('black')) {
                    getCell(container, row, c).classList.add('highlight'); c--;
                }
                c = col + 1;
                while (c < 7 && getCell(container, row, c) && !getCell(container, row, c).classList.contains('black')) {
                    getCell(container, row, c).classList.add('highlight'); c++;
                }
            } else {
                let r = row;
                while (r >= 0 && getCell(container, r, col) && !getCell(container, r, col).classList.contains('black')) {
                    getCell(container, r, col).classList.add('highlight'); r--;
                }
                r = row + 1;
                while (r < 7 && getCell(container, r, col) && !getCell(container, r, col).classList.contains('black')) {
                    getCell(container, r, col).classList.add('highlight'); r++;
                }
            }
        }

        function getCell(r, c) { return container.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`); }

        function checkPassword() {
            const inputField = document.getElementById('pwd-1');
            const errorMsg = document.getElementById('error-1');
            if (inputField.value.trim().toUpperCase().replace(/\s+/g, '') === 'MONAMOUR') {
                alert('Bravo ! Le niveau 1 est validé ! 🎉');
            } else {
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
