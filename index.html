<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mots Fléchés Romantiques</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdf2f4;
            color: #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #d85a7f;
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-align: center;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #8c7b80;
            margin-bottom: 20px;
            text-align: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 45px);
            grid-template-rows: repeat(5, 45px);
            gap: 3px;
            background-color: #d85a7f;
            padding: 5px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(216, 90, 127, 0.2);
        }

        .cell {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        /* Case noire / flèche */
        .cell.black {
            background-color: #3b3035;
            font-size: 0.5rem;
            color: white;
            text-align: center;
            padding: 2px;
            line-height: 1.1;
            font-weight: bold;
        }

        /* Cases du mot mystère */
        .cell.mystery {
            background-color: #ffe6ed;
            font-weight: bold;
            color: #d85a7f;
        }

        /* Surlignage du mot actif (devient blanc ou rose clair) */
        .cell.highlight {
            background-color: #ffffff !important;
            box-shadow: inset 0 0 0 2px #d85a7f;
        }
        .cell.mystery.highlight {
            background-color: #fff0f3 !important;
            box-shadow: inset 0 0 0 2px #d85a7f;
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            background: transparent;
            color: #3b3035;
            cursor: pointer;
        }

        .cell input:focus {
            outline: none;
        }

        .clues {
            margin-top: 25px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        .clues h3 {
            margin-top: 0;
            color: #d85a7f;
            font-size: 1.1rem;
            border-bottom: 2px solid #ffe6ed;
            padding-bottom: 5px;
        }

        .clues ul {
            padding-left: 20px;
            margin-bottom: 0;
            font-size: 0.9rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h1>💖 Mots Doux Fléchés 💖</h1>
    <p class="subtitle">Clique une fois pour horizontal, une deuxième fois pour vertical !</p>

    <!-- Grille 5x5 avec un index [ligne][colonne] de 0 à 4 -->
    <div class="grid-container" id="crossword-grid">
        <!-- Ligne 0 -->
        <div class="cell black" data-row="0" data-col="0">Mois</div>
        <div class="cell" data-row="0" data-col="1"><input type="text" maxlength="1"></div>
        <div class="cell" data-row="0" data-col="2"><input type="text" maxlength="1"></div>
        <div class="cell" data-row="0" data-col="3"><input type="text" maxlength="1"></div>
        <div class="cell black" data-row="0" data-col="4"></div>

        <!-- Ligne 1 -->
        <div class="cell" data-row="1" data-col="0"><input type="text" maxlength="1"></div>
        <div class="cell mystery" data-row="1" data-col="1"><input type="text" maxlength="1"></div>
        <div class="cell" data-row="1" data-col="2"><input type="text" maxlength="1"></div>
        <div class="cell" data-row="1" data-col="3"><input type="text" maxlength="1"></div>
        <div class="cell black" data-row="1" data-col="4"></div>

        <!-- Ligne 2 -->
        <div class="cell mystery" data-row="2" data-col="0"><input type="text" maxlength="1"></div>
        <div class="cell" data-row="2" data-col="1"><input type="text" maxlength="1"></div>
        <div class="cell" data-row="2" data-col="2"><input type="text" maxlength="1"></div>
        <div class="cell" data-row="2" data-col="3"><input type="text" maxlength="1"></div>
        <div class="cell mystery" data-row="2" data-col="4"><input type="text" maxlength="1"></div>

        <!-- Ligne 3 -->
        <div class="cell mystery" data-row="3" data-col="0"><input type="text" maxlength="1"></div>
        <div class="cell black" data-row="3" data-col="1">Plat</div>
        <div class="cell" data-row="3" data-col="2"><input type="text" maxlength="1"></div>
        <div class="cell" data-row="3" data-col="3"><input type="text" maxlength="1"></div>
        <div class="cell mystery" data-row="3" data-col="4"><input type="text" maxlength="1"></div>

        <!-- Ligne 4 -->
        <div class="cell mystery" data-row="4" data-col="0"><input type="text" maxlength="1"></div>
        <div class="cell black" data-row="4" data-col="1"></div>
        <div class="cell black" data-row="4" data-col="2"></div>
        <div class="cell black" data-row="4" data-col="3"></div>
        <div class="cell mystery" data-row="4" data-col="4"><input type="text" maxlength="1"></div>
    </div>

    <div class="clues">
        <h3>Indices :</h3>
        <ul>
            <li><strong>Ligne 0 :</strong> Notre mois de rencontre</li>
            <li><strong>Ligne 3 :</strong> Ton plat préféré</li>
            <li><strong>💡 Mot mystère :</strong> Les cases spéciales forment le secret final !</li>
        </ul>
    </div>

    <script>
        const inputs = document.querySelectorAll('.grid-container .cell input');
        let currentDirection = 'H'; // 'H' pour Horizontal, 'V' pour Vertical
        let activeCell = null;

        inputs.forEach(input => {
            const cell = input.parentElement;
            const row = parseInt(cell.dataset.row);
            const col = parseInt(cell.dataset.col);

            // Gestion du clic pour basculer la direction
            input.addEventListener('click', (e) => {
                if (activeCell === cell) {
                    // Si on clique une 2ème fois sur la même case, on inverse la direction
                    currentDirection = currentDirection === 'H' ? 'V' : 'H';
                } else {
                    activeCell = cell;
                    currentDirection = 'H'; // Par défaut, priorité horizontale au premier clic
                }
                updateHighlight();
            });

            // Gestion de la saisie et du saut automatique
            input.addEventListener('input', (e) => {
                const val = input.value.toUpperCase();
                input.value = val; // Force les majuscules

                if (val.length === 1) {
                    moveToNext(row, col, 1);
                }
            });

            // Gestion de la touche Retour Arrière (Backspace) pour reculer
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '') {
                    moveToNext(row, col, -1);
                }
            });
        });

        // Fonction pour trouver et focus la case suivante/précédente selon la direction
        function moveToNext(row, col, step) {
            let nextRow = row;
            let nextCol = col;

            if (currentDirection === 'H') {
                nextCol += step;
            } else {
                nextRow += step;
            }

            // Recherche de la case correspondante dans la grille
            const nextCell = document.querySelector(`.cell[data-row="${nextRow}"][data-col="${nextCol}"]`);
            if (nextCell) {
                const nextInput = nextCell.querySelector('input');
                if (nextInput) {
                    nextInput.focus();
                    activeCell = nextCell;
                    updateHighlight();
                }
            }
        }

        // Met en surbrillance le mot en cours (ligne ou colonne)
        function updateHighlight() {
            // Nettoyer tous les surlignages
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('highlight'));

            if (!activeCell) return;

            const row = parseInt(activeCell.dataset.row);
            const col = parseInt(activeCell.dataset.col);

            if (currentDirection === 'H') {
                // Surligner toute la ligne de mots adjacents
                let c = col;
                while (c >= 0 && getCell(row, c) && !getCell(row, c).classList.contains('black')) {
                    getCell(row, c).classList.add('highlight');
                    c--;
                }
                c = col + 1;
                while (c < 5 && getCell(row, c) && !getCell(row, c).classList.contains('black')) {
                    getCell(row, c).classList.add('highlight');
                    c++;
                }
            } else {
                // Surligner toute la colonne de mots adjacents
                let r = row;
                while (r >= 0 && getCell(r, col) && !getCell(r, col).classList.contains('black')) {
                    getCell(r, col).classList.add('highlight');
                    r--;
                }
                r = row + 1;
                while (r < 5 && getCell(r, col) && !getCell(r, col).classList.contains('black')) {
                    getCell(r, col).classList.add('highlight');
                    r++;
                }
            }
        }

        function getCell(r, c) {
            return document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
        }
    </script>
</body>
</html>
