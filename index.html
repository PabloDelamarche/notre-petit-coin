<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mots Fléchés Romantiques</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdf2f4;
            color: #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #d85a7f;
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-align: center;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #8c7b80;
            margin-bottom: 20px;
            text-align: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 45px);
            grid-template-rows: repeat(5, 45px);
            gap: 3px;
            background-color: #d85a7f;
            padding: 5px;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(216, 90, 127, 0.2);
        }

        .cell {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 4px;
        }

        .cell.black {
            background-color: #3b3035;
            font-size: 0.5rem;
            color: white;
            text-align: center;
            padding: 2px;
            line-height: 1.1;
            font-weight: bold;
        }

        .cell.mystery {
            background-color: #ffe6ed;
            font-weight: bold;
            color: #d85a7f;
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            background: transparent;
            color: #3b3035;
            cursor: pointer;
        }

        .cell input:focus {
            outline: none;
            background-color: #fff0f3;
        }

        /* Indicateur visuel de direction (optionnel, s'active en bas de page) */
        .direction-indicator {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #d85a7f;
            font-weight: bold;
        }

        .clues {
            margin-top: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        .clues h3 {
            margin-top: 0;
            color: #d85a7f;
            font-size: 1rem;
            border-bottom: 2px solid #ffe6ed;
            padding-bottom: 5px;
        }

        .clues ul {
            padding-left: 20px;
            margin-bottom: 0;
            font-size: 0.85rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>💖 Mots Doux Fléchés 💖</h1>
    <p class="subtitle">Clique une fois (Ligne) ou deux fois (Colonne) pour changer de sens !</p>

    <!-- Grille 5x5 avec des coordonnées (row, col de 0 à 4) -->
    <div class="grid-container" id="grid">
        <!-- Ligne 0 -->
        <div class="cell black">Mois ?</div>
        <div class="cell"><input type="text" maxlength="1" data-row="0" data-col="1"></div>
        <div class="cell"><input type="text" maxlength="1" data-row="0" data-col="2"></div>
        <div class="cell"><input type="text" maxlength="1" data-row="0" data-col="3"></div>
        <div class="cell black"></div>

        <!-- Ligne 1 -->
        <div class="cell"><input type="text" maxlength="1" data-row="1" data-col="0"></div>
        <div class="cell mystery"><input type="text" maxlength="1" data-row="1" data-col="1"></div>
        <div class="cell"><input type="text" maxlength="1" data-row="1" data-col="2"></div>
        <div class="cell"><input type="text" maxlength="1" data-row="1" data-col="3"></div>
        <div class="cell black"></div>

        <!-- Ligne 2 -->
        <div class="cell mystery"><input type="text" maxlength="1" data-row="2" data-col="0"></div>
        <div class="cell"><input type="text" maxlength="1" data-row="2" data-col="1"></div>
        <div class="cell"><input type="text" maxlength="1" data-row="2" data-col="2"></div>
        <div class="cell"><input type="text" maxlength="1" data-row="2" data-col="3"></div>
        <div class="cell mystery"><input type="text" maxlength="1" data-row="2" data-col="4"></div>

        <!-- Ligne 3 -->
        <div class="cell mystery"><input type="text" maxlength="1" data-row="3" data-col="0"></div>
        <div class="cell black">Plat ?</div>
        <div class="cell"><input type="text" maxlength="1" data-row="3" data-col="2"></div>
        <div class="cell"><input type="text" maxlength="1" data-row="3" data-col="3"></div>
        <div class="cell mystery"><input type="text" maxlength="1" data-row="3" data-col="4"></div>

        <!-- Ligne 4 -->
        <div class="cell mystery"><input type="text" maxlength="1" data-row="4" data-col="0"></div>
        <div class="cell black"></div>
        <div class="cell black"></div>
        <div class="cell black"></div>
        <div class="cell mystery"><input type="text" maxlength="1" data-row="4" data-col="4"></div>
    </div>

    <div class="direction-indicator" id="directionIndicator">Sens actuel : ➡️ Ligne</div>

    <div class="clues">
        <h3>Indices :</h3>
        <ul>
            <li><strong>Ligne 1 :</strong> Notre mois de rencontre</li>
            <li><strong>Ligne 4 :</strong> Ton plat préféré</li>
            <li>💡 <em>Astuce :</em> Remplis la grille pour découvrir le mot mystère rose !</li>
        </ul>
    </div>

    <script>
        const inputs = document.querySelectorAll('.grid-container input');
        let currentDirection = 'horizontal'; // 'horizontal' par défaut, 'vertical' si double clic
        let lastFocusedInput = null;
        let clickCount = 0;
        let clickTimer = null;

        inputs.forEach(input => {
            // Gestion du clic et du double-clic subtil
            input.addEventListener('click', (e) => {
                if (lastFocusedInput === e.target) {
                    clickCount++;
                    if (clickCount === 2) {
                        // Double clic sur la même case -> Inverser la direction
                        currentDirection = (currentDirection === 'horizontal') ? 'vertical' : 'horizontal';
                        updateIndicator();
                        clickCount = 0;
                    }
                } else {
                    lastFocusedInput = e.target;
                    clickCount = 1;
                    currentDirection = 'horizontal'; // Priorité ligne par défaut sur un nouveau clic
                    updateIndicator();
                }
            });

            // Quand on tape une lettre
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                if (value.length === 1) {
                    moveToNext(e.target);
                }
            });

            // Gestion de la touche Retour Arrière (Backspace) pour reculer
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '') {
                    moveToPrev(e.target);
                }
            });
        });

        function moveToNext(currentInput) {
            let row = parseInt(currentInput.dataset.row);
            let col = parseInt(currentInput.dataset.col);

            if (currentDirection === 'horizontal') {
                col += 1;
            } else {
                row += 1;
            }

            const nextInput = document.querySelector(`input[data-row="${row}"][data-col="${col}"]`);
            if (nextInput) {
                nextInput.focus();
                lastFocusedInput = nextInput;
            }
        }

        function moveToPrev(currentInput) {
            let row = parseInt(currentInput.dataset.row);
            let col = parseInt(currentInput.dataset.col);

            if (currentDirection === 'horizontal') {
                col -= 1;
            } else {
                row -= 1;
            }

            const prevInput = document.querySelector(`input[data-row="${row}"][data-col="${col}"]`);
            if (prevInput) {
                prevInput.focus();
                lastFocusedInput = prevInput;
            }
        }

        function updateIndicator() {
            const indicator = document.getElementById('directionIndicator');
            if (currentDirection === 'horizontal') {
                indicator.innerText = "Sens actuel : ➡️ Ligne (Clique 2 fois sur la case pour passer en Colonne ⬇️)";
            } else {
                indicator.innerText = "Sens actuel : ⬇️ Colonne (Clique 2 fois sur la case pour passer en Ligne ➡️)";
            }
        }
    </script>
</body>
</html>
